# Default values for api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

AspNetCoreEnvironment: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
AppSettingSecretsName: "appsettingssecret-qa-integration-session-api-qa"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.2
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  portfolio: integration

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  annotations: 
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/whitelist-source-range: XX.XX.XX.XX/32
  hosts:
    - host: api1.ccl-k8.org
      paths:
        path: /integration-session-qa/(.*)
  tls:
  - hosts:
    - api1.ccl-k8.org
    secretName: tls-secret
    

env:
  normal: []
  secret: []

livenessProbe:
  httpGet:
    path: /_liveness
    port: http

readinessProbe:
  httpGet:
    path: /_liveness
    port: http

resources:
    limits:
        cpu: 250m
        memory: 640Mi
    requests:
        cpu: 25m
        memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 95
  targetMemoryUtilizationPercentage: 95

nodeSelector: {}

tolerations: []

affinity: {}